exec "overrides/autoexec.cfg"

echo "-------------------------------------- Loaded spy.cfg -------------------------------------"

// ---------- START DISGUISE BIND LOGIC ----------

// Bind enemy team commands to aliases
alias enemy_scout "disguise 1 -1"
alias enemy_sniper "disguise 2 -1"
alias enemy_soldier "disguise 3 -1"
alias enemy_demoman "disguise 4 -1"
alias enemy_medic "disguise 5 -1"
alias enemy_heavy "disguise 6 -1"
alias enemy_pyro "disguise 7 -1"
alias enemy_spy "disguise 8 -1"
alias enemy_engineer "disguise 9 -1"

// Bind friendly team commands to aliases
alias friend_scout "disguise 1 -2"
alias friend_sniper "disguise 2 -2"
alias friend_soldier "disguise 3 -2"
alias friend_demoman "disguise 4 -2"
alias friend_medic "disguise 5 -2"
alias friend_heavy "disguise 6 -2"
alias friend_pyro "disguise 7 -2"
alias friend_spy "disguise 8 -2"
alias friend_engineer "disguise 9 -2"

// Create disguise layers for mapping to modifier key
alias disguise_enemy "alias disguise_scout enemy_scout; alias disguise_sniper enemy_sniper; alias disguise_soldier enemy_soldier; alias disguise_demoman enemy_demoman; alias disguise_medic enemy_medic; alias disguise_heavy enemy_heavy; alias disguise_pyro enemy_pyro; alias disguise_spy enemy_spy; alias disguise_engineer enemy_engineer;"
alias disguise_friend "alias disguise_scout friend_scout; alias disguise_sniper friend_sniper; alias disguise_soldier friend_soldier; alias disguise_demoman friend_demoman; alias disguise_medic friend_medic; alias disguise_heavy friend_heavy; alias disguise_pyro friend_pyro; alias disguise_spy friend_spy; alias disguise_engineer friend_engineer;"

// Execute untoggled layer as default
disguise_enemy

// We are using the keypad 0 to control disguise binds, it appears that
// the keypad region is treated as a different segment from the rest of the
// keyboard and therefore, using keys like Shift for toggling will not work.
bind kp_ins +keypadToggle
alias -keypadToggle "disguise_enemy;"
alias +keypadToggle "disguise_friend;"

// Setup keybinds with layer toggle alias. Yes, binding on a numpad
// means you get names that correspond to their numlock-off functionality.
// Very nice~!
//
// But on the other hand, they are listed in descending order and
// the classes are in a higher row based on use.

// 9. Spy
bind kp_pgup "disguise_spy"
// 8. Medic
bind kp_uparrow "disguise_medic"
// 7. Sniper
bind kp_home "disguise_sniper"
// 6. Demoman
bind kp_rightarrow "disguise_demoman"
// 5. Engineer
bind kp_5 "disguise_engineer"
// 4. Soldier
bind kp_leftarrow "disguise_soldier"
// 3. Scout
bind kp_pgdn "disguise_scout"
// 2. Heavy
bind kp_downarrow "disguise_heavy"
// 1. Pyro
bind kp_end "disguise_pyro"

// ----------- END DISGUISE BIND LOGIC -----------
